<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaJugada - Apuestas Deportivas en Vivo y Próximos Partidos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        novaDark: '#07090e',
                        novaCard: '#111827',
                        novaYellow: '#facc15',
                        novaYellowHover: '#eab308',
                        novaGray: '#1f2937',
                        novaBorder: '#374151'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-novaDark text-gray-100 font-sans min-h-screen pb-24">

    <!-- ================= VISTA DE AUTENTICACIÓN (LOGIN / REGISTRO) ================= -->
    <div id="authView" class="hidden fixed inset-0 z-50 bg-novaDark flex flex-col justify-center items-center px-4">
        <div class="bg-novaCard border border-novaBorder p-6 rounded-2xl w-full max-w-md shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <div class="flex justify-center items-center gap-2 text-2xl font-black text-white">
                    <i class="fas fa-bolt text-novaYellow"></i> NOVA<span class="text-novaYellow">JUGADA</span>
                </div>
                <p class="text-xs text-gray-400">Regístrate o inicia sesión para apostar en vivo y en los próximos encuentros.</p>
            </div>

            <div class="flex border-b border-novaBorder text-sm font-bold">
                <button onclick="switchAuthTab('login')" id="tabLogin" class="flex-1 pb-2 text-center text-novaYellow border-b-2 border-novaYellow">Acceder</button>
                <button onclick="switchAuthTab('register')" id="tabRegister" class="flex-1 pb-2 text-center text-gray-400">Registrarse</button>
            </div>

            <!-- Login -->
            <div id="formLogin" class="space-y-4">
                <div>
                    <label class="text-xs text-gray-400">Correo o Usuario</label>
                    <input type="text" id="loginUser" class="w-full bg-novaGray border border-novaBorder rounded-lg px-3 py-2 text-sm text-white focus:border-novaYellow outline-none" placeholder="ej. juanduran">
                </div>
                <div>
                    <label class="text-xs text-gray-400">Contraseña</label>
                    <input type="password" id="loginPass" class="w-full bg-novaGray border border-novaBorder rounded-lg px-3 py-2 text-sm text-white focus:border-novaYellow outline-none" placeholder="••••••••">
                </div>
                <button onclick="handleLogin()" class="w-full bg-novaYellow hover:bg-novaYellowHover text-black font-extrabold py-2.5 rounded-lg text-sm transition shadow-lg">
                    Iniciar Sesión
                </button>
            </div>

            <!-- Registro -->
            <div id="formRegister" class="hidden space-y-4">
                <div>
                    <label class="text-xs text-gray-400">Nombre de Usuario</label>
                    <input type="text" id="regUser" class="w-full bg-novaGray border border-novaBorder rounded-lg px-3 py-2 text-sm text-white focus:border-novaYellow outline-none" placeholder="Crea tu usuario">
                </div>
                <div>
                    <label class="text-xs text-gray-400">Correo Electrónico</label>
                    <input type="email" id="regEmail" class="w-full bg-novaGray border border-novaBorder rounded-lg px-3 py-2 text-sm text-white focus:border-novaYellow outline-none" placeholder="correo@domain.com">
                </div>
                <div>
                    <label class="text-xs text-gray-400">Contraseña</label>
                    <input type="password" id="regPass" class="w-full bg-novaGray border border-novaBorder rounded-lg px-3 py-2 text-sm text-white focus:border-novaYellow outline-none" placeholder="Mínimo 6 caracteres">
                </div>
                <button onclick="handleRegister()" class="w-full bg-novaYellow hover:bg-novaYellowHover text-black font-extrabold py-2.5 rounded-lg text-sm transition shadow-lg">
                    Crear Cuenta y Obtener Bono ($50)
                </button>
            </div>
        </div>
    </div>

    <!-- ================= APLICACIÓN PRINCIPAL ================= -->
    <div id="appView" class="hidden">
        <!-- Header -->
        <header class="bg-novaCard border-b border-novaBorder sticky top-0 z-40 shadow-md">
            <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center gap-2 font-black text-xl tracking-wider text-white">
                    <i class="fas fa-bolt text-novaYellow"></i> NOVA<span class="text-novaYellow">JUGADA</span>
                </div>
                <div class="flex items-center gap-2">
                    <button id="btnAdmin" onclick="toggleAdminPanel()" class="hidden bg-novaYellow/20 text-novaYellow border border-novaYellow/40 px-2.5 py-1 rounded-lg text-xs font-bold flex items-center gap-1">
                        <i class="fas fa-crown"></i> Admin
                    </button>
                    <div class="bg-novaGray border border-novaBorder px-3 py-1 rounded-full text-xs font-bold text-novaYellow flex items-center gap-2">
                        <span>$ <span id="userBalance">50.00</span></span>
                        <button onclick="openWalletModal()" class="text-white hover:text-novaYellow"><i class="fas fa-wallet"></i></button>
                    </div>
                    <button onclick="handleLogout()" class="text-gray-400 hover:text-red-400 text-xs px-2"><i class="fas fa-sign-out-alt text-base"></i></button>
                </div>
            </div>

            <!-- Filtros: En Vivo / Próximos Partidos -->
            <div class="bg-black/60 border-t border-novaBorder px-4 py-2 flex gap-4 overflow-x-auto text-xs font-bold text-gray-300">
                <button onclick="filterTab('all')" id="btnAll" class="text-novaYellow border-b-2 border-novaYellow pb-1">Todos</button>
                <button onclick="filterTab('live')" id="btnLive" class="hover:text-novaYellow pb-1 text-gray-400">En Vivo Ahora</button>
                <button onclick="filterTab('upcoming')" id="btnUpcoming" class="hover:text-novaYellow pb-1 text-gray-400">Próximos Partidos</button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-7xl mx-auto px-4 py-4 space-y-4">
            <div class="flex justify-between items-center bg-novaCard border border-novaBorder p-3 rounded-xl">
                <div class="flex items-center gap-2 text-xs font-bold text-red-500 animate-pulse">
                    <i class="fas fa-circle text-[8px]"></i> CARTELERA ACTIVA 100% REAL
                </div>
                <span class="text-xs text-gray-400 bg-novaGray px-2 py-1 rounded font-semibold">Fútbol Internacional</span>
            </div>

            <!-- Contenedor de Partidos -->
            <div id="matchContainer" class="space-y-3">
                <!-- Se cargan dinámicamente -->
            </div>
        </main>

        <!-- Navegación Inferior -->
        <nav class="fixed bottom-0 left-0 right-0 bg-novaCard border-t border-novaBorder flex justify
