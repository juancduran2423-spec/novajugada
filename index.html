<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaJugada - Apuestas Deportivas en Vivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#131b2e',
                        accentGreen: '#10b981',
                        accentGold: '#f59e0b',
                        darkBorder: '#1e293b'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-gray-100 font-sans min-h-screen pb-16">

    <!-- Header / Navbar -->
    <header class="bg-cardBg border-b border-darkBorder sticky top-0 z-50 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fas fa-bolt text-accentGold text-xl animate-pulse"></i>
                <span class="text-xl font-bold tracking-wider text-white">Nova<span class="text-accentGold">Jugada</span></span>
            </div>
            <div class="flex items-center gap-3">
                <!-- Botón de Admin Oculto por defecto (Protegido con llave secreta) -->
                <button id="btnAdmin" onclick="toggleAdminPanel()" class="hidden bg-accentGold/20 text-accentGold border border-accentGold/30 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 hover:bg-accentGold/30 transition">
                    <i class="fas fa-crown"></i> Admin
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content / Cartelera en Vivo -->
    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
        <!-- Banner promocional -->
        <div class="bg-gradient-to-r from-blue-900/40 to-emerald-900/40 border border-darkBorder p-4 rounded-xl flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-extrabold text-white">Cartelera en Vivo y Cash Out</h1>
                <p class="text-gray-400 text-sm">Apuestas en tiempo real, pago anticipado de 2 goles y bloqueo por jugadas peligrosas.</p>
            </div>
            <div class="flex gap-2 text-xs flex-wrap">
                <span class="bg-accentGold/10 text-accentGold border border-accentGold/30 px-2.5 py-1 rounded-full"><i class="fas fa-shield-alt"></i> Pago 2 Goles</span>
                <span class="bg-red-500/15 text-red-400 border border-red-500/30 px-2.5 py-1 rounded-full">🔴 Cash Out Dinámico con Bloqueo de Riesgo</span>
            </div>
        </div>

        <!-- Contenedor de Partidos en Vivo -->
        <div id="matchContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Los partidos se cargan dinámicamente -->
        </div>
    </main>

    <!-- Script de Tiempo Real, Cash Out Dinámico y Estrellas -->
    <script>
        const matchesData = [
            {
                id: 1,
                league: "Premier League",
                teamA: "Real Madrid",
                teamB: "Barcelona",
                logoA: "https://media.api-sports.io/football/teams/541.png",
                logoB: "https://media.api-sports.io/football/teams/529.png",
                formA: ["G", "G", "E", "G", "P"],
                formB: ["G", "P", "G", "G", "G"],
                recommendation: "Alta probabilidad de Ambos Anotan debido al poder ofensivo reciente.",
                odds: { home: 2.10, draw: 3.40, away: 3.20 },
                goalsA: 1,
                goalsB: 0,
                minute: "68'",
                status: "En curso",
                dangerousAttack: false, 
                activeBet: { type: 'Local (1)', amount: 10, cashOutValue: 14.50 }
            },
            {
                id: 2,
                league: "Liga FUTVE / Internacional",
                teamA: "Vinotinto (Selección)",
                teamB: "Brasil (Selección)",
                logoA: "https://media.api-sports.io/football/teams/2382.png",
                logoB: "https://media.api-sports.io/football/teams/6.png",
                formA: ["E", "G", "P", "G", "E"],
                formB: ["G", "G", "G", "E", "P"],
                recommendation: "Se recomienda cuota conservadora a doble oportunidad visitante.",
                odds: { home: 3.80, draw: 3.50, away: 1.95 },
                goalsA: 0,
                goalsB: 2,
                minute: "82'",
                status: "En curso",
                dangerousAttack: true, // Jugada peligrosa activa (bloquea Cash Out)
                activeBet: { type: 'Visita (2)', amount: 20, cashOutValue: 35.00 }
            }
        ];

        function renderMatches() {
            const container = document.getElementById('matchContainer');
            container.innerHTML = '';

            matchesData.forEach(match => {
                const card = document.createElement('div');
                card.className = 'bg-cardBg border border-darkBorder rounded-xl p-4 shadow-md space-y-4';
                
                // Determinación de estrellas si el partido finaliza (Verde para aciertos, Roja para fallos)
                let star1 = '', starX = '', star2 = '';
                if (match.status.includes('Finalizado')) {
                    if (match.goalsA > match.goalsB) { star1 = ' ⭐🟢'; starX = ' ⭐🔴'; star2 = ' ⭐🔴'; }
                    else if (match.goalsA < match.goalsB) { star1 = ' ⭐🔴'; starX = ' ⭐🔴'; star2 = ' ⭐🟢'; }
                    else { star1 = ' ⭐🔴'; starX = ' ⭐🟢'; star2 = ' ⭐🔴'; }
                }

                // Generación de sección de Cash Out en vivo (Rojo con letras amarillas y control de peligro)
                let cashOutHtml = '';
                if (match.status === 'En curso' && match.activeBet) {
                    if (match.dangerousAttack) {
                        cashOutHtml = `<div class="bg-red-950/40 border border-red-500/40 p-2.5 rounded-lg text-center text-xs text-red-400 font-bold animate-pulse">
                            ⚠️ ¡Jugada peligrosa en curso! Cash Out temporalmente bloqueado.
                        </div>`;
                    } else {
                        cashOutHtml = `<div class="flex justify-between items-center bg-darkBg border border-darkBorder p-2.5 rounded-lg">
                            <span class="text-xs text-gray-400">Apuesta activa (${match.activeBet.type}):</span>
                            <button onclick="executeCashOut(${match.id})" class="bg-red-600 hover:bg-red-700 text-accentGold border border-accentGold/40 px-3 py-1.5 rounded-lg font-extrabold text-xs shadow-lg transition flex items-center gap-1.5">
                                <i class="fas fa-hand-holding-usd"></i> Cerrar por: $${match.activeBet.cashOutValue.toFixed(2)}
                            </button>
                        </div>`;
                    }
                }

                card.innerHTML = `
                    <div class="flex justify-between items-center text-xs text-gray-400 border-b border-darkBorder pb-2">
                        <span><i class="fas fa-trophy text-accentGold"></i> ${match.league}</span>
                        <span class="bg-emerald-500/10 text-accentGreen px-2 py-0.5 rounded font-bold animate-pulse"><i class="fas fa-circle text-[8px]"></i> EN VIVO (${match.minute})</span>
                    </div>

                    <!-- Equipos, Escudos y Marcador -->
                    <div class="grid grid-cols-3 items-center text-center gap-2">
                        <div class="flex flex-col items-center gap-1">
                            <img src="${match.logoA}" alt="${match.teamA}" class="w-12 h-12 object-contain" onerror="this.src='https://via.placeholder.com/48?text=Escudo'">
                            <span class="text-sm font-bold text-white">${match.teamA}</span>
                            <div class="text-[10px] text-gray-400">Últimos 5: [${match.formA.join(', ')}]</div>
                        </div>
                        <div class="flex flex-col items-center">
                            <span class="text-xs text-gray-500 font-bold uppercase">Marcador</span>
                            <div class="text-sm bg-darkBg border border-darkBorder px-3 py-1 rounded mt-1 text-accentGold font-extrabold">
                                ${match.goalsA} - ${match.goalsB}
                            </div>
                            <span class="text-[10px] text-gray-400 mt-1">${match.status}</span>
                        </div>
                        <div class="flex flex-col items-center gap-1">
                            <img src="${match.logoB}" alt="${match.teamB}" class="w-12 h-12 object-contain" onerror="this.src='https://via.placeholder.com/48?text=Escudo'">
                            <span class="text-sm font-bold text-white">${match.teamB}</span>
                            <div class="text-[10px] text-gray-400">Últimos 5: [${match.formB.join(', ')}]</div>
                        </div>
                    </div>

                    <!-- Recomendación Inteligente de IA -->
                    <div class="bg-darkBg/60 border border-darkBorder p-2.5 rounded-lg text-xs text-gray-300 flex items-start gap-2">
                        <i class="fas fa-brain text-accentGold mt-0.5"></i>
                        <div><strong class="text-white">Análisis IA:</strong> ${match.recommendation}</div>
                    </div>

                    <!-- Cash Out Dinámico (Rojo y letras amarillas) -->
                    ${cashOutHtml}

                    <!-- Cuadritos de Cuotas con Estrellas -->
                    <div class="grid grid-cols-3 gap-2 pt-1">
                        <button onclick="placeBet(${match.id}, '1', ${match.odds.home})" class="bg-darkBg hover:bg-emerald-950/40 border border-darkBorder hover:border-accentGreen p-2 rounded-lg text-center transition">
                            <div class="text-[10px] text-gray-400">1 (Local)${star1}</div>
                            <div class="text-xs font-extrabold text-accentGreen">${match.odds.home}</div>
                        </button>
                        <button onclick="placeBet(${match.id}, 'X', ${match.odds.draw})" class="bg-darkBg hover:bg-amber-950/40 border border-darkBorder hover:border-accentGold p-2 rounded-lg text-center transition">
                            <div class="text-[10px] text-gray-400">X (Empate)${starX}</div>
                            <div class="text-xs font-extrabold text-accentGold">${match.odds.draw}</div>
                        </button>
                        <button onclick="placeBet(${match.id}, '2', ${match.odds.away})" class="bg-darkBg hover:bg-emerald-950/40 border border-darkBorder hover:border-accentGreen p-2 rounded-lg text-center transition">
                            <div class="text-[10px] text-gray-400">2 (Visita)${star2}</div>
                            <div class="text-xs font-extrabold text-accentGreen">${match.odds.away}</div>
                        </button>
                    </div>

                    <!-- Panel de Control y Simulación en Vivo -->
                    <div class="flex flex-col sm:flex-row justify-between items-center pt-2 border-t border-darkBorder text-xs gap-2">
                        <span class="text-gray-400">Simulador en Vivo:</span>
                        <div class="flex gap-1.5 flex-wrap">
                            <button onclick="toggleDanger(${match.id})" class="bg-amber-600/20 text-amber-400 border border-amber-500/30 px-2 py-1 rounded">Peligro (Bloqueo)</button>
                            <button onclick="simulateGoals(${match.id}, 1, 0)" class="bg-blue-600/20 text-blue-400 border border-blue-500/30 px-2 py-1 rounded">Gol Local</button>
                            <button onclick="finalizeMatch(${match.id})" class="bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 px-2 py-1 rounded">Finalizar</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function placeBet(matchId, type, odd) {
            alert(`¡Apuesta en vivo registrada! Selección: ${type} a cuota ${odd}.`);
        }

        function executeCashOut(matchId) {
            const m = matchesData.find(x => x.id === matchId);
            if(m && m.activeBet && !m.dangerousAttack) {
                alert(`¡Cash Out ejecutado con éxito! Se acreditaron $${m.activeBet.cashOutValue.toFixed(2)} a tu saldo.`);
                m.activeBet = null;
                renderMatches();
            }
        }

        function toggleDanger(matchId) {
            const m = matchesData.find(x => x.id === matchId);
            if(m) {
                m.dangerousAttack = !m.dangerousAttack;
                if(m.dangerousAttack && m.activeBet) {
                    m.activeBet.cashOutValue = Math.max(1.00, m.activeBet.cashOutValue * 0.4); 
                }
                renderMatches();
            }
        }

        function simulateGoals(matchId, addA, addB) {
            const m = matchesData.find(x => x.id === matchId);
            if(m && m.status === "En curso") {
                m.goalsA += addA;
                m.goalsB += addB;

                if(m.activeBet) {
                    m.activeBet.cashOutValue *= (addA > 0 ? 1.3 : 0.5); 
                }

                if(Math.abs(m.goalsA - m.goalsB) >= 2) {
                    alert(`🚨 ¡PAGO ANTICIPADO ACTIVADO! El equipo con ventaja de 2+ goles gana automáticamente.`);
                    m.status = "Finalizado (Pago Anticipado)";
                    m.activeBet = null;
                }
                renderMatches();
            }
        }

        function finalizeMatch(matchId) {
            const m = matchesData.find(x => x.id === matchId);
            if(m) {
                m.status = "Finalizado";
                m.activeBet = null;
                renderMatches();
            }
        }

        // Llave secreta del Admin (?admin=juan2026)[span_2](start_span)[span_2](end_span)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('admin') === 'juan2026' || localStorage.getItem('nova_owner') === 'true') {
            localStorage.setItem('nova_owner', 'true');
            const btnAdmin = document.getElementById('btnAdmin');
            if (btnAdmin) btnAdmin.classList.remove('hidden');
        }

        function toggleAdminPanel() {
            alert('Abriendo Panel de Control de Administrador...');
        }

        window.onload = renderMatches;
    </script>
</body>
</html>
